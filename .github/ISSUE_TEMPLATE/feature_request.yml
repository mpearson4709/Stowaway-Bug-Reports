name: Feature Request
description: Suggest something for Stowaway or Stowaway Pro
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What problem would this solve for you?
    validations:
      required: false
